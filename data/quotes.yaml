# Lines cycled by the typed masthead on the home page.
# `pre` renders in the body colour, `accent` in the accent colour; "\n" forces a line break.
lines:
  - pre: "Experience taught me that\n"
    accent: "simplicity scales."
  - pre: "If you can't do Good,\n"
    accent: "do Bad well."
  - pre: "Notes from "
    accent: "/dev/null."
