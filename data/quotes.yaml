# Lines cycled by the typed masthead on the home page.
# `pre` renders in the body colour, `accent` in the accent colour; "\n" forces a line break.
lines:
  - pre: "Experience taught me that\n"
    accent: "simplicity scales better than complexity ever will."
  - pre: "If you can't do Good,\n"
    accent: "better do Bad well."
  - pre: "Make it work, make it right,\n"
    accent: "make it fast."
  - pre: "Nothing is permanent\n"
    accent: "except the temporary fix."
  - pre: "Read the logs.\n"
    accent: "They were trying to tell you."
  - pre: "Whether you think you can, or you think you can't\n"
    accent: "- you're right."
  - pre: "I don't have a backup plan.\n"
    accent: "I have a plan to make a backup."
  - pre: "Trust, but verify.\n"
    accent: "Then verify again after the update."
  - pre: "A quick fix is just a long fix\n"
    accent: "that hasn't started yet."
  - pre: "99% uptime.\n"
    accent: "The 1% was me 'just checking something'."
