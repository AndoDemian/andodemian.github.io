baseURL = "https://andodemian.com/"
locale = "en-US"
timeZone = "Europe/Bucharest"
title = "Ando Demian"
theme = "nuno"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Keep the old Astro feed URL (/rss.xml) working for existing subscribers
[outputFormats.RSS]
  baseName = "rss"

[outputs]
  # JSON index powers the built-in search page
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  # Allow raw HTML in posts (embeds, details/summary, etc.)
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  ground = "brown"
  defaultTheme = "auto"
  brand = "Ando Demian"
  description = "If you can't do Good, better do Bad well."
  tagline = "Experience taught me that simplicity scales better than complexity ever will."
  copyright = "© 2026 Ando Demian"
  favicon = "/favicon.ico"
  mainSections = ["posts"]
  postsOnHome = 6
  homeStyle = "ledger"
  readingProgress = true

  # GoatCounter analytics: set your code (e.g. "andodemian" for andodemian.goatcounter.com).
  # Leave empty to disable tracking entirely.
  goatcounter = ""

  [params.author]
    name = "Ando"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/AndoDemian"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/andrei-tita-2b01361b1/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:andodemian@outlook.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 30

[taxonomies]
  tag = "tags"
